
services:
  postgres:
    image: postgres:16-alpine
    container_name: edvexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: edvexa
      POSTGRES_PASSWORD: edvexa_local_dev
      POSTGRES_DB: edvexa_support
    ports:
      - "5433:5432"
    volumes:
      - edvexa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edvexa -d edvexa_support"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  edvexa_postgres_data:
